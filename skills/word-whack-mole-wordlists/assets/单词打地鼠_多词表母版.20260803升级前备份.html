function stars(){for(let t=0;t<2;t++)$('stars'+t).innerHTML=Array.from({length:GOAL},(_,i)=>'<span class="star '+(i<scores[t]?'on':'')+'">★</span>').join('');$('team0').classList.toggle('active',team===0);$('team1').classList.toggle('active',team===1)}function refill(){deck=shuffle(words)}function pick(){if(!deck.length)refill();return deck.pop()}function choices(target){return shuffle([target,...shuffle(words.filter(x=>x!==target)).slice(0,2)])}
function round(){clearInterval(timer);roundLocked=false;current=pick();$('prompt').textContent='听一听';document.querySelectorAll('.hole').forEach(h=>{h.className='hole';h.querySelector('.word').textContent=''});let spots=shuffle([0,1,2,3,4,5]).slice(0,3),opts=choices(current);spots.forEach((n,i)=>{let h=document.querySelector('.hole[data-i="'+n+'"]');h.dataset.answer=opts[i];fitWordLabel(h.querySelector('.word'),opts[i]);setTimeout(()=>h.classList.add('up'),100+i*120)});timeLeft=ROUND_MS;$('timerbar').style.transform='scaleX(1)';setTimeout(()=>speakWord(current),460);timer=setInterval(()=>{timeLeft-=80;$('timerbar').style.transform='scaleX('+Math.max(0,timeLeft/ROUND_MS)+')';if(timeLeft<=0)timeout()},80);stars()}
function hit(h,e){if(roundLocked||!h.classList.contains('up'))return;roundLocked=true;clearInterval(timer);hammer(e.clientX,e.clientY);let ok=h.dataset.answer===current;if(ok){h.classList.add('correct');scores[team]++;burst(e.clientX,e.clientY);sound('good');setTimeout(()=>{$('flash').textContent='答对啦！';$('flash').classList.add('show');setTimeout(()=>$('flash').classList.remove('show'),430)},420);stars();if(scores[team]>=GOAL)return setTimeout(win,1050);setTimeout(next,980)}else{h.classList.add('wrong');[...document.querySelectorAll('.hole.up')].find(x=>x.dataset.answer===current)?.classList.add('reveal');sound('bad');toast('哎呀！正确的是 '+current);setTimeout(next,1150)}}function timeout(){if(roundLocked)return;roundLocked=true;clearInterval(timer);[...document.querySelectorAll('.hole.up')].find(x=>x.dataset.answer===current)?.classList.add('reveal');sound('bad');toast('时间到！正确的是 '+current);setTimeout(next,1200)}function next(){team=1-team;document.querySelectorAll('.hole').forEach(h=>h.classList.remove('up'));setTimeout(round,360)}
function hammer(x,y){let h=$('hammer');h.style.left=x+'px';h.style.top=(y+42)+'px';h.classList.remove('show');void h.offsetWidth;h.classList.add('show');setTimeout(()=>h.classList.remove('show'),500)}function burst(x,y){let b=$('burst');b.style.left=x+'px';b.style.top=y+'px';b.classList.remove('show');void b.offsetWidth;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),750)}function win(){roundLocked=true;clearInterval(timer);$('winner').textContent=(team===0?'🐳 蓝队':'🦄 红队')+'赢啦！';$('winnerScore').textContent='率先集齐 '+GOAL+' 颗星！';$('winnerModal').classList.remove('hidden');sound('win')}
function start(){gameStarted=true;unlockSpeech();team=0;scores=[0,0];deck=[];$('start').classList.add('hidden');$('winnerModal').classList.add('hidden');center('READY!');setTimeout(()=>{center('GO!');setTimeout(round,500)},650)}function center(s){$('flash').textContent=s;$('flash').classList.remove('show');void $('flash').offsetWidth;$('flash').classList.add('show');setTimeout(()=>$('flash').classList.remove('show'),700)}function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
function unlockSpeech(){if(!('speechSynthesis' in window))return;try{speechSynthesis.resume()}catch(e){}}
function speakWord(text){if(!text||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;u.pitch=1;u.volume=1;let vs=speechSynthesis.getVoices(),v=vs.find(x=>/^en-US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast('当前浏览器未能朗读单词')}}
function sound(type){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let now=audioCtx.currentTime,g=audioCtx.createGain();g.connect(audioCtx.destination);if(type==='good'){[520,780,1040].forEach((f,i)=>{let o=audioCtx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start(now+i*.08);o.stop(now+i*.08+.12)});g.gain.setValueAtTime(.12,now);g.gain.exponentialRampToValueAtTime(.01,now+.38)}else if(type==='bad'){let o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(70,now+.25);o.connect(g);o.start(now);o.stop(now+.28);g.gain.setValueAtTime(.1,now);g.gain.exponentialRampToValueAtTime(.01,now+.28)}else{[392,523,659,784].forEach((f,i)=>{let o=audioCtx.createOscillator();o.frequency.value=f;o.connect(g);o.start(now+i*.12);o.stop(now+i*.12+.2)});g.gain.setValueAtTime(.11,now);g.gain.exponentialRampToValueAtTime(.01,now+.7)}}catch(e){}}
async function fullscreen(){let d=document,r=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement){let ex=d.exitFullscreen||d.webkitExitFullscreen;await ex.call(d)}else{let en=r.requestFullscreen||r.webkitRequestFullscreen;if(en)await en.call(r)}}catch(e){toast('请在浏览器中打开后使用全屏')}}function parse(text){let out=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(out.length<3)return null;let keys=out.map(x=>x.toLocaleLowerCase('en-US'));return new Set(keys).size===keys.length?out:null}
function fillEditor(id){let item=wordLists.find(x=>x.id===id);if(!item)return;$('listName').value=item.name;$('wordInput').value=item.words.join('\n');$('listCount').textContent=item.words.length+' 个单词';$('deleteList').disabled=wordLists.length<=1}
function renderListManager(){let select=$('listSelect');select.innerHTML=wordLists.map(x=>'<option value="'+x.id.replace(/"/g,'&quot;')+'">'+x.name.replace(/</g,'&lt;')+'</option>').join('');select.value=activeListId;$('storageNote').textContent='固定词表版：可切换和游玩；新增或修改词表请由 agent 更新 HTML。';$('editPanel').classList.toggle('hidden',!CAN_EDIT_LISTS);$('readonlyActions').classList.toggle('hidden',CAN_EDIT_LISTS);if(CAN_EDIT_LISTS)fillEditor(activeListId)}
function openSettings(){clearInterval(timer);roundLocked=true;renderListManager();$('settingModal').classList.add('show')}
function closeSettings(resume=true){$('settingModal').classList.remove('show');if(resume&&gameStarted)round()}
function switchSelected(){let id=$('listSelect').value;if(!wordLists.some(x=>x.id===id))return;activeListId=id;applyActiveList();persistLibrary();closeSettings(false);start()}
function newListDraft(){$('listSelect').value='';$('listName').value='';$('wordInput').value='';$('listCount').textContent='请先填写词表名称，再填写至少 3 个英文单词';$('listName').focus()}
function saveList(){let name=$('listName').value.trim(),parsed=parse($('wordInput').value);if(!name)return toast('请先填写词表名称');if(!parsed)return toast('至少 3 个英文单词，且不能重复');let selected=$('listSelect').value,duplicate=wordLists.find(x=>x.name===name&&x.id!==selected);if(duplicate)return toast('已有同名词表，请换一个名称');let item=wordLists.find(x=>x.id===selected);if(item){item.name=name;item.words=parsed;item.updatedAt=Date.now();activeListId=item.id}else{item={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name,updatedAt:Date.now(),words:parsed};wordLists.push(item);activeListId=item.id}applyActiveList();persistLibrary();closeSettings(false);start()}
function deleteSelected(){let id=$('listSelect').value,item=wordLists.find(x=>x.id===id);if(!item)return toast('请先选择要删除的词表');if(wordLists.length<=1)return toast('至少保留一张词表');if(!confirm('删除词表“'+item.name+'”？'))return;wordLists=wordLists.filter(x=>x.id!==id);if(!deletedIds.includes(id))deletedIds.push(id);activeListId=wordLists[0].id;applyActiveList();persistLibrary();closeSettings(false);start()}
$('startBtn').onclick=start;$('again').onclick=start;$('settings').onclick=openSettings;$('cancel').onclick=()=>closeSettings(true);$('closeLists').onclick=()=>closeSettings(true);$('switchList').onclick=switchSelected;$('listSelect').onchange=e=>{if(CAN_EDIT_LISTS)fillEditor(e.target.value)};$('newList').onclick=newListDraft;$('save').onclick=saveList;$('deleteList').onclick=deleteSelected;$('wordInput').oninput=()=>{$('listCount').textContent=$('wordInput').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).length+' 行'};$('sound').onclick=()=>{if(!current)return toast('点击开始后可朗读当前单词');unlockSpeech();speakWord(current);toast('正在朗读 '+current)};$('full').onclick=fullscreen;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')fullscreen();if(/^[1-6]$/.test(e.key)){let h=document.querySelector('.hole[data-i="'+(+e.key-1)+'"]');if(h){let r=h.getBoundingClientRect();hit(h,{clientX:r.left+r.width/2,clientY:r.top+r.height/2})}}});applyActiveList();buildField();stars();
</script></body></html>
